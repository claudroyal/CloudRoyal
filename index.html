<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudRoyal — Premium Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Шапка -->
  <header class="top-header">
    <div class="logo-group">
      <div class="logo-avatar">CR</div>
      <div>
        <div class="brand-title">CloudRoyal</div>
        <div class="brand-sub">PREMIUM STORE</div>
      </div>
    </div>
    <button class="cart-btn" aria-label="Кошик">🛒</button>
  </header>

  <main class="main-content">
    
    <!-- Баннер -->
    <section class="hero-banner">
      <span class="badge-tag">CLOUDROYAL</span>
      <h1>Твій смак.<br>Твій вибір.</h1>
      <p class="hero-text">Рідини, POD-системи та картриджі в одному місці.</p>
      <a href="#catalog" class="btn-primary">
        Перейти до каталогу <span>→</span>
      </a>
    </section>

    <!-- Вибір категорії -->
    <section class="section-block">
      <div class="section-label">КАТАЛОГ</div>
      <h2 class="section-title">Обери категорію</h2>

      <div class="category-cards">
        <div class="cat-card active" onclick="selectCategory('liquids', this)">
          <div class="icon-box">💧</div>
          <div class="cat-details">
            <h3>Рідини</h3>
            <p>Смаки та бренди</p>
          </div>
          <span class="arrow">→</span>
        </div>

        <div class="cat-card" onclick="selectCategory('pods', this)">
          <div class="icon-box">◇</div>
          <div class="cat-details">
            <h3>POD-системи</h3>
            <p>Пристрої</p>
          </div>
          <span class="arrow">→</span>
        </div>

        <div class="cat-card" onclick="selectCategory('cartridges', this)">
          <div class="icon-box">▢</div>
          <div class="cat-details">
            <h3>Картриджі</h3>
            <p>Витратні матеріали</p>
          </div>
          <span class="arrow">→</span>
        </div>
      </div>
    </section>

    <!-- Секція товарів -->
    <section class="section-block" id="catalog">
      <div class="section-header">
        <div>
          <div class="section-label" id="current-cat-label">РІДИНИ</div>
          <h2 class="section-title" id="current-cat-title">Обери свій смак</h2>
        </div>
        <span class="products-count" id="products-count">0 товарів</span>
      </div>

      <!-- Пошук -->
      <div class="search-field">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Пошук бренду або смаку...">
      </div>

      <!-- Теги -->
      <div class="filter-pills">
        <button class="pill-btn active" onclick="selectTag('all', this)">Усі</button>
        <button class="pill-btn" onclick="selectTag('new', this)">✦ Новинки</button>
        <button class="pill-btn" onclick="selectTag('popular', this)">Популярне</button>
        <button class="pill-btn" onclick="selectTag('sale', this)">— Знижки</button>
      </div>

      <!-- Бренди -->
      <div class="brands-bar">
        <span class="brands-label">БРЕНДИ</span>
        <div class="brands-scroll" id="brands-container"></div>
      </div>

      <!-- КАРТКИ ТОВАРІВ -->
      <div class="products-grid" id="products-grid"></div>
    </section>

  </main>

  <!-- Нижнє меню -->
  <nav class="bottom-nav">
    <button class="nav-item active">🏠</button>
    <button class="nav-item">🔍</button>
    <button class="nav-item">♡</button>
    <button class="nav-item">🛒</button>
    <button class="nav-item">👤</button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
