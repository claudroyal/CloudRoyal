<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vape Shop Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container">
      <h1 class="logo">VAPE SHOP</h1>
    </div>
  </header>

  <main class="container">
    <!-- Фільтр за категоріями -->
    <section class="filter-section">
      <h3>Категорії:</h3>
      <div class="chips-group">
        <button class="chip active" data-category="all" onclick="setCategory('all')">Усі</button>
        <button class="chip" data-category="pods" onclick="setCategory('pods')">POD-системи</button>
        <button class="chip" data-category="cartridges" onclick="setCategory('cartridges')">Картриджі</button>
      </div>
    </section>

    <!-- Фільтр за брендами -->
    <section class="filter-section">
      <h3>Бренди:</h3>
      <div class="chips-group">
        <button class="chip active" data-brand="all" onclick="setBrand('all')">Усі бренди</button>
        <button class="chip" data-brand="VAPORESSO" onclick="setBrand('VAPORESSO')">VAPORESSO</button>
        <button class="chip" data-brand="OXVA" onclick="setBrand('OXVA')">OXVA</button>
        <button class="chip" data-brand="VOOPOO" onclick="setBrand('VOOPOO')">VOOPOO</button>
        <button class="chip" data-brand="LOST VAPE" onclick="setBrand('LOST VAPE')">LOST VAPE</button>
      </div>
    </section>

    <!-- Сітка товарів -->
    <section id="products-grid" class="products-grid">
      <!-- Товари рендеряться через JS -->
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
