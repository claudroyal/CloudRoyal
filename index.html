<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudRoyal — Vapor Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #121218;
      --accent-color: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --text-color: #ffffff;
      --text-dim: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 80px; }

    /* Header */
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 20px; background: rgba(18, 18, 24, 0.8);
      backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid rgba(168, 85, 247, 0.2);
    }
    .logo { font-size: 20px; font-weight: 800; color: #fff; text-shadow: 0 0 10px var(--accent-glow); }
    .logo span { color: var(--accent-color); }
    .cart-btn {
      position: relative; background: var(--accent-color); border: none;
      color: #fff; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Hero / Catalog */
    .container { padding: 20px; }
    h1 { margin-bottom: 15px; font-size: 22px; text-shadow: 0 0 8px var(--accent-glow); }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
    .card {
      background: var(--card-bg); border-radius: 12px; padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05); transition: 0.2s;
    }
    .card:hover { border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-glow); }
    .card-title { font-size: 15px; margin: 8px 0 4px; font-weight: 600; }
    .card-price { color: var(--accent-color); font-weight: bold; margin-bottom: 8px; }
    .add-btn {
      width: 100%; background: transparent; border: 1px solid var(--accent-color);
      color: #fff; padding: 6px; border-radius: 8px; cursor: pointer; font-weight: bold;
    }
    .add-btn:active { background: var(--accent-color); }

    /* Modal / Cart */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      z-index: 1000; justify-content: center; align-items: flex-end;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg); width: 100%; max-height: 80vh; overflow-y: auto;
      border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px;
      border-top: 2px solid var(--accent-color);
    }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .input-field {
      width: 100%; padding: 10px; margin-top: 8px; background: #1a1a24;
      border: 1px solid #333; color: #fff; border-radius: 8px; outline: none;
    }
    .input-field:focus { border-color: var(--accent-color); }
    .submit-btn {
      width: 100%; background: var(--accent-color); color: #fff; border: none;
      padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 15px; cursor: pointer;
      box-shadow: 0 0 15px var(--accent-glow);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">CLOUD<span>ROYAL</span></div>
    <button class="cart-btn" onclick="toggleCart()">🛒 <span id="cart-count">0</span></button>
  </header>

  <div class="container">
    <h1>Каталог</h1>
    <div class="grid" id="catalog"></div>
  </div>

  <!-- Modal Cart -->
  <div class="modal" id="cart-modal">
    <div class="modal-content">
      <h2>Твоє Замовлення</h2>
      <div id="cart-items" style="margin: 15px 0;"></div>
      <p style="font-weight: bold;">Разом: <span id="cart-total" style="color: var(--accent-color);">0</span> грн</p>
      
      <input type="text" id="user-name" class="input-field" placeholder="Ваше ім'я або Telegram @username">
      <input type="tel" id="user-phone" class="input-field" placeholder="Номер телефону">
      <input type="text" id="user-comment" class="input-field" placeholder="Коментар (необов'язково)">
      
      <button class="submit-btn" onclick="submitOrder()">Оформити замовлення</button>
      <button onclick="toggleCart()" style="width: 100%; background: transparent; border: none; color: var(--text-dim); margin-top: 10px; padding: 8px; cursor: pointer;">Закрити</button>
    </div>
  </div>

  <script>
    // ⚠️ СЮДИ ВСТАВ СВОЄ ПОСИЛАННЯ З GOOGLE APPS SCRIPT (ДЕПЛОЙ)
    const GOOGLE_SCRIPT_URL = "ВСТАВ_СЮДИ_WEB_APP_URL";

    const products = [
      { id: 1, name: "Chaser Black 30ml", price: 280 },
      { id: 2, name: "Elfliq Salt 30ml", price: 320 },
      { id: 3, name: "XROS 3 Mini Pod", price: 790 },
      { id: 4, name: "Ursa Nano S Pod", price: 650 },
      { id: 5, name: "Картридж Vaporesso 0.6 Ohm", price: 110 }
    ];

    let cart = {};

    function renderCatalog() {
      const catalog = document.getElementById("catalog");
      catalog.innerHTML = products.map(p => `
        <div class="card">
          <div class="card-title">${p.name}</div>
          <div class="card-price">${p.price} грн</div>
          <button class="add-btn" onclick="addToCart(${p.id})">+ Додати</button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateCartUI();
    }

    function updateCartUI() {
      const totalCount = Object.values(cart).reduce((a, b) => a + b, 0);
      document.getElementById("cart-count").innerText = totalCount;

      let itemsHtml = "";
      let totalPrice = 0;

      for (let id in cart) {
        const item = products.find(p => p.id == id);
        const qty = cart[id];
        const itemTotal = item.price * qty;
        totalPrice += itemTotal;

        itemsHtml += `
          <div class="cart-item">
            <div>
              <div><b>${item.name}</b></div>
              <div style="font-size: 12px; color: var(--text-dim);">${item.price} грн x ${qty} = ${itemTotal} грн</div>
            </div>
            <div>
              <button onclick="changeQty(${id}, -1)" style="padding: 2px 8px;">-</button>
              <button onclick="changeQty(${id}, 1)" style="padding: 2px 8px;">+</button>
            </div>
          </div>
        `;
      }

      document.getElementById("cart-items").innerHTML = itemsHtml || "Корзина порожня";
      document.getElementById("cart-total").innerText = totalPrice;
    }

    function changeQty(id, delta) {
      if (cart[id]) {
        cart[id] += delta;
        if (cart[id] <= 0) delete cart[id];
      }
      updateCartUI();
    }

    function toggleCart() {
      document.getElementById("cart-modal").classList.toggle("active");
    }

    async function submitOrder() {
      const name = document.getElementById("user-name").value.trim();
      const phone = document.getElementById("user-phone").value.trim();
      const comment = document.getElementById("user-comment").value.trim();

      if (Object.keys(cart).length === 0) return alert("Корзина порожня!");
      if (!name || !phone) return alert("Будь ласка, вкажіть ім'я та телефон!");

      let itemsList = [];
      let totalQty = 0;
      let totalPrice = 0;

      for (let id in cart) {
        const item = products.find(p => p.id == id);
        const qty = cart[id];
        itemsList.push(`${item.name} (${qty} шт)`);
        totalQty += qty;
        totalPrice += item.price * qty;
      }

      const orderData = {
        user: name,
        phone: phone,
        items: itemsList.join(", "),
        totalQuantity: totalQty,
        totalPrice: totalPrice,
        comment: comment
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });

        alert("Замовлення успішно відправлено!");
        cart = {};
        updateCartUI();
        toggleCart();
      } catch (err) {
        alert("Помилка відправки, спробуйте ще раз");
        console.error(err);
      }
    }

    renderCatalog();
  </script>
</body>
</html>
