<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b0b0f"
    >

    <title>CloudRoyal</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

    <div class="header-left">

        <div class="logo-mark">
            C
        </div>

        <div>

            <div class="logo">
                CloudRoyal
            </div>

            <div class="logo-subtitle">
                premium store
            </div>

        </div>

    </div>


    <button
        class="header-cart"
        onclick="openCart()"
    >

        <span>
            🛒
        </span>

        <b id="cartCount">
            0
        </b>

    </button>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main id="mainContent">


    <!-- HERO -->

    <section class="hero">

        <div class="hero-content">

            <div class="hero-label">
                CLOUDROYAL STORE
            </div>

            <h1>
                Твій вибір.
                <br>
                Твій смак.
            </h1>

            <p>
                Преміальні рідини та пристрої
                в одному місці.
            </p>


            <button
                class="hero-button"
                onclick="openLiquids()"
            >

                Перейти до рідин

                <span>
                    →
                </span>

            </button>

        </div>


        <div class="hero-glow"></div>

    </section>



    <!-- QUICK CATEGORIES -->

    <section class="quick-section">

        <div class="section-heading">

            <h2>
                Каталог
            </h2>

        </div>


        <div class="quick-categories">


            <button
                class="quick-card"
                onclick="openLiquids()"
            >

                <span class="quick-icon">
                    ◉
                </span>

                <span>
                    Рідина
                </span>

                <small>
                    Смаки
                </small>

            </button>


            <button
                class="quick-card"
                onclick="openCategory('pod')"
            >

                <span class="quick-icon">
                    ◈
                </span>

                <span>
                    POD-системи
                </span>

                <small>
                    Пристрої
                </small>

            </button>


            <button
                class="quick-card"
                onclick="openCategory('cartridges')"
            >

                <span class="quick-icon">
                    ◆
                </span>

                <span>
                    Картриджі
                </span>

                <small>
                    Аксесуари
                </small>

            </button>

        </div>

    </section>



    <!-- NEW -->

    <section class="product-section">

        <div class="section-heading">

            <div>

                <span class="section-kicker">
                    NEW
                </span>

                <h2>
                    Новинки
                </h2>

            </div>


            <button
                class="view-all"
                onclick="openCategory('new')"
            >
                Все →
            </button>

        </div>


        <div
            class="products"
            id="newProducts"
        ></div>

    </section>



    <!-- POPULAR -->

    <section class="product-section">

        <div class="section-heading">

            <div>

                <span class="section-kicker">
                    CHOICE
                </span>

                <h2>
                    Популярне
                </h2>

            </div>


            <button
                class="view-all"
                onclick="openCategory('popular')"
            >
                Все →
            </button>

        </div>


        <div
            class="products"
            id="popularProducts"
        ></div>

    </section>



    <!-- SALE -->

    <section class="product-section">

        <div class="section-heading">

            <div>

                <span class="section-kicker sale-kicker">
                    SALE
                </span>

                <h2>
                    Знижки
                </h2>

            </div>


            <button
                class="view-all"
                onclick="openCategory('sale')"
            >
                Все →
            </button>

        </div>


        <div
            class="products"
            id="saleProducts"
        ></div>

    </section>


</main>



<!-- =========================================
     CATALOG PAGE
========================================= -->

<section
    id="catalogPage"
    class="page"
>

    <div class="page-header">

        <button
            class="back-button"
            onclick="goHome()"
        >
            ←
        </button>

        <h1>
            Каталог
        </h1>

    </div>


    <div class="catalog-content">


        <!-- LIQUID -->

        <div class="catalog-main-card">

            <button
                class="catalog-main-button"
                onclick="openLiquids()"
            >

                <div>

                    <strong>
                        Рідина
                    </strong>

                    <small>
                        Обери бренд
                    </small>

                </div>


                <span>
                    →
                </span>

            </button>


            <div
                id="liquidBrands"
                class="brands"
            >

                <button
                    onclick="openBrand('CHASER')"
                >
                    CHASER
                </button>

                <button
                    onclick="openBrand('MOOD DUCK')"
                >
                    MOOD DUCK
                </button>

                <button
                    onclick="openBrand('PUNCH')"
                >
                    PUNCH
                </button>

                <button
                    onclick="openBrand('OCTOBAR')"
                >
                    OCTOBAR
                </button>

                <button
                    onclick="openBrand('FLAVORLAB')"
                >
                    FLAVORLAB
                </button>

                <button
                    onclick="openBrand('LUCKY')"
                >
                    LUCKY
                </button>

                <button
                    onclick="openBrand('REFROST')"
                >
                    REFROST
                </button>

                <button
                    onclick="openBrand('HYPE')"
                >
                    HYPE
                </button>

                <button
                    onclick="openBrand('3GER')"
                >
                    3GER
                </button>

                <button
                    onclick="openBrand('ALCHEMIST')"
                >
                    ALCHEMIST
                </button>

                <button
                    onclick="openBrand('INBOTTLE')"
                >
                    INBOTTLE
                </button>


                <button
                    class="show-all-brands"
                    onclick="openCategory('liquid')"
                >
                    Показати всі
                    <span>→</span>
                </button>

            </div>

        </div>



        <!-- OTHER CATEGORIES -->

        <button
            class="catalog-row"
            onclick="openCategory('pod')"
        >

            <span>
                POD-системи
            </span>

            <span>
                →
            </span>

        </button>


        <button
            class="catalog-row"
            onclick="openCategory('cartridges')"
        >

            <span>
                Картриджі
            </span>

            <span>
                →
            </span>

        </button>


        <button
            class="catalog-row"
            onclick="openCategory('new')"
        >

            <span>
                Новинки
            </span>

            <span>
                →
            </span>

        </button>


        <button
            class="catalog-row"
            onclick="openCategory('popular')"
        >

            <span>
                Популярне
            </span>

            <span>
                →
            </span>

        </button>


        <button
            class="catalog-row"
            onclick="openCategory('sale')"
        >

            <span>
                Знижки
            </span>

            <span class="sale-text">
                →
            </span>

        </button>


    </div>

</section>



<!-- =========================================
     CATEGORY PAGE
========================================= -->

<section
    id="categoryPage"
    class="page"
>

    <div class="page-header">

        <button
            class="back-button"
            onclick="openCatalog()"
        >
            ←
        </button>

        <h1 id="categoryTitle">
            Категорія
        </h1>

    </div>


    <div class="category-toolbar">

        <div
            id="categoryDescription"
            class="category-description"
        ></div>

    </div>


    <div
        id="categoryProducts"
        class="products page-products"
    ></div>

</section>



<!-- =========================================
     BRAND PAGE
========================================= -->

<section
    id="brandPage"
    class="page"
>

    <div class="page-header">

        <button
            class="back-button"
            onclick="openLiquids()"
        >
            ←
        </button>

        <h1 id="brandTitle">
            Бренд
        </h1>

    </div>


    <div
        id="brandProducts"
        class="products page-products"
    ></div>

</section>



<!-- =========================================
     FAVORITES
========================================= -->

<section
    id="favoritesPage"
    class="page"
>

    <div class="page-header">

        <button
            class="back-button"
            onclick="goHome()"
        >
            ←
        </button>

        <h1>
            Обране
        </h1>

    </div>


    <div
        id="favoriteProducts"
        class="products page-products"
    ></div>

</section>



<!-- =========================================
     CART
========================================= -->

<div
    id="cartOverlay"
    class="overlay"
    onclick="closeCart(event)"
>

    <div
        class="cart-sheet"
        onclick="event.stopPropagation()"
    >

        <div class="sheet-handle"></div>


        <div class="sheet-header">

            <h2>
                Кошик
            </h2>

            <button
                onclick="closeCart()"
            >
                ×
            </button>

        </div>


        <div
            id="cartItems"
            class="cart-items"
        ></div>


        <div
            id="cartEmpty"
            class="cart-empty"
        >

            <div>
                🛒
            </div>

            <strong>
                Кошик порожній
            </strong>

            <span>
                Додай товари з каталогу
            </span>

        </div>


        <div class="cart-bottom">

            <div class="cart-total-row">

                <span>
                    Разом
                </span>

                <strong id="cartTotal">
                    0 ₴
                </strong>

            </div>


            <button
                class="checkout-button"
                onclick="openCheckout()"
            >
                Оформити замовлення
            </button>

        </div>

    </div>

</div>



<!-- =========================================
     CHECKOUT
========================================= -->

<div
    id="checkoutOverlay"
    class="overlay"
    onclick="closeCheckout(event)"
>

    <div
        class="checkout-sheet"
        onclick="event.stopPropagation()"
    >

        <div class="sheet-handle"></div>


        <div class="sheet-header">

            <h2>
                Замовлення
            </h2>

            <button
                onclick="closeCheckout()"
            >
                ×
            </button>

        </div>


        <div class="checkout-form">

            <label>
                Ім'я
            </label>

            <input
                id="customerName"
                type="text"
                placeholder="Як до вас звертатися?"
            >


            <label>
                Телефон
            </label>

            <input
                id="customerPhone"
                type="tel"
                placeholder="+380..."
            >


            <button
                class="checkout-button"
                onclick="submitOrder()"
            >
                Підтвердити замовлення
            </button>

        </div>

    </div>

</div>



<!-- =========================================
     TOAST
========================================= -->

<div
    id="toast"
    class="toast"
></div>



<!-- =========================================
     BOTTOM NAV
========================================= -->

<nav class="bottom-nav">


    <button
        onclick="goHome()"
        class="nav-item active"
        id="navHome"
    >

        <span class="nav-icon">
            ⌂
        </span>

        <span>
            Головна
        </span>

    </button>


    <button
        onclick="openCatalog()"
        class="nav-item"
        id="navCatalog"
    >

        <span class="nav-icon">
            ≡
        </span>

        <span>
            Каталог
        </span>

    </button>


    <button
        onclick="showFavorites()"
        class="nav-item"
        id="navFavorites"
    >

        <span class="nav-icon">
            ♡
        </span>

        <span>
            Обране
        </span>

    </button>


    <button
        onclick="openCart()"
        class="nav-item"
    >

        <span class="nav-icon">
            🛒
        </span>

        <span>
            Кошик
        </span>

    </button>


</nav>


<script src="script.js"></script>

</body>

</html>
