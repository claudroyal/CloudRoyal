<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#191c1e"
    >

    <title>CloudRoyal</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>


<body>


    <!-- =========================
         ГЛАВНАЯ
    ========================== -->

    <div id="homePage">

        <header>

            <h1>
                CloudRoyal
            </h1>

            <p>
                Преміальний магазин
            </p>

        </header>


        <main>

            <section class="banner">

                <h2>
                    CloudRoyal
                </h2>

                <p>
                    Обери свій товар та замовляй зручно
                </p>

                <button onclick="openCatalog()">
                    Відкрити каталог
                </button>

            </section>


            <div class="home-section-header">

                <h2>
                    Популярне
                </h2>

                <button
                    class="text-button"
                    onclick="openCategory('popular')"
                >
                    Дивитись все →
                </button>

            </div>


            <div
                class="products"
                id="homeProducts"
            ></div>


            <div class="home-section-header">

                <h2>
                    Знижки
                </h2>

                <button
                    class="text-button"
                    onclick="openCategory('sale')"
                >
                    Дивитись все →
                </button>

            </div>


            <div
                class="products"
                id="homeSaleProducts"
            ></div>

        </main>

    </div>



    <!-- =========================
         КАТАЛОГ
    ========================== -->

    <div
        id="catalogPage"
        class="page"
    >

        <div class="catalog-header">

            <button
                class="back-button"
                onclick="closeCatalog()"
            >
                ←
            </button>


            <h2>
                Каталог
            </h2>

        </div>


        <div class="catalog-list">


            <button
                class="category-row"
                onclick="openCategory('liquid')"
            >

                <span>
                    Рідина
                </span>

                <span class="arrow">
                    →
                </span>

            </button>


            <button
                class="category-row"
                onclick="openCategory('pod')"
            >

                <span>
                    POD-Системи
                </span>

                <span class="arrow">
                    →
                </span>

            </button>


            <button
                class="category-row"
                onclick="openCategory('cartridges')"
            >

                <span>
                    Картриджі
                </span>

                <span class="arrow">
                    →
                </span>

            </button>


            <button
                class="category-row"
                onclick="openCategory('new')"
            >

                <span>
                    Новинки
                </span>

                <span class="arrow">
                    →
                </span>

            </button>


            <button
                class="category-row"
                onclick="openCategory('popular')"
            >

                <span>
                    Популярне
                </span>

                <span class="arrow">
                    →
                </span>

            </button>


            <button
                class="category-row"
                onclick="openCategory('sale')"
            >

                <span>
                    Знижки
                </span>

                <span class="arrow">
                    →
                </span>

            </button>


        </div>

    </div>



    <!-- =========================
         СТРАНИЦА КАТЕГОРИИ
    ========================== -->

    <div
        id="categoryPage"
        class="page"
    >

        <div class="catalog-header">

            <button
                class="back-button"
                onclick="closeCategory()"
            >
                ←
            </button>


            <h2 id="categoryTitle">
                Категорія
            </h2>

        </div>


        <main>

            <div
                class="products category-products"
                id="categoryProducts"
            ></div>

        </main>

    </div>



    <!-- =========================
         ИЗБРАННОЕ
    ========================== -->

    <div
        id="favoritesPage"
        class="page"
    >

        <div class="catalog-header">

            <button
                class="back-button"
                onclick="goHome()"
            >
                ←
            </button>


            <h2>
                Обране
            </h2>

        </div>


        <main>

            <div
                class="products"
                id="favoriteProducts"
            ></div>

        </main>

    </div>



    <!-- =========================
         КОРЗИНА
    ========================== -->

    <div
        id="cartWindow"
        class="modal"
    >

        <div class="modal-content">

            <button
                class="modal-close"
                onclick="closeCart()"
            >
                ×
            </button>


            <h2>
                🛒 Кошик
            </h2>


            <div id="cartItems"></div>


            <div
                id="cartTotal"
                class="cart-total"
            >
                Разом: 0 ₴
            </div>


            <button
                class="main-button"
                onclick="openCheckout()"
            >
                Оформити замовлення
            </button>

        </div>

    </div>



    <!-- =========================
         ОФОРМЛЕНИЕ
    ========================== -->

    <div
        id="checkoutWindow"
        class="modal"
    >

        <div class="modal-content">

            <button
                class="modal-close"
                onclick="closeCheckout()"
            >
                ×
            </button>


            <h2>
                Оформлення
            </h2>


            <input
                id="customerName"
                type="text"
                placeholder="Ваше ім'я"
            >


            <input
                id="customerPhone"
                type="tel"
                placeholder="Номер телефону"
            >


            <button
                class="main-button"
                onclick="submitOrder()"
            >
                Підтвердити замовлення
            </button>

        </div>

    </div>



    <!-- =========================
         НИЖНЕЕ МЕНЮ
    ========================== -->

    <nav class="menu">


        <button onclick="goHome()">

            <span class="menu-icon">
                🏠
            </span>

            <span>
                Головна
            </span>

        </button>


        <button onclick="openCatalog()">

            <span class="menu-icon">
                🔍
            </span>

            <span>
                Каталог
            </span>

        </button>


        <button onclick="showFavorites()">

            <span class="menu-icon">
                ❤️
            </span>

            <span>
                Обране
            </span>

        </button>


        <button onclick="showCart()">

            <span class="menu-icon">
                🛒
            </span>

            <span>
                Кошик
            </span>

        </button>


    </nav>



    <script src="script.js"></script>

</body>

</html>
