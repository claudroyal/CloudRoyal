<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CloudRoyal</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Telegram Mini App -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>


<body>


    <!-- ========================= -->
    <!-- ШАПКА -->
    <!-- ========================= -->

    <header>

        <h1>
            CloudRoyal
        </h1>

        <p>
            Добро пожаловать в наш магазин
        </p>

    </header>


    <!-- ========================= -->
    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <!-- ========================= -->

    <main>


        <!-- БАННЕР -->

        <section class="banner">

            <h2>
                CloudRoyal Premium Store
            </h2>

            <p>
                Лучшие товары в одном месте
            </p>

            <button onclick="scrollToProducts()">
                Открыть каталог
            </button>

        </section>


        <!-- ЗАГОЛОВОК -->

        <h2>
            Популярные товары
        </h2>


        <!-- ПОИСК -->

        <div class="search">

            <input
                type="text"
                id="search"
                placeholder="Поиск товара..."
            >

        </div>


        <!-- КАТЕГОРИИ -->

        <div class="categories">

            <button>
                Все
            </button>

            <button>
                Новинки
            </button>

            <button>
                Популярное
            </button>

            <button>
                Акции
            </button>

        </div>


        <!-- ========================= -->
        <!-- ТОВАРЫ -->
        <!-- ========================= -->

        <div
            class="products"
            id="products"
        >

            <!--
                Товары сюда добавляет JavaScript
            -->

        </div>


    </main>


    <!-- ========================= -->
    <!-- НИЖНЕЕ МЕНЮ -->
    <!-- ========================= -->

    <nav class="menu">


        <button onclick="goHome()">

            🏠

            <span>
                Главная
            </span>

        </button>


        <button onclick="scrollToProducts()">

            🔍

            <span>
                Каталог
            </span>

        </button>


        <button onclick="showFavorites()">

            ❤️

            <span>
                Избранное
            </span>

        </button>


        <button onclick="showCart()">

            🛒

            <span>
                Корзина
            </span>

        </button>


        <button onclick="showProfile()">

            👤

            <span>
                Профиль
            </span>

        </button>


    </nav>


    <!-- ========================= -->
    <!-- КОРЗИНА -->
    <!-- ========================= -->

    <div
        id="cartWindow"
        class="cart-window"
    >

        <h2>
            🛒 Корзина
        </h2>


        <div id="cartItems"></div>


        <h3 id="cartTotal">
            Итого: 0 ₽
        </h3>


        <button onclick="openCheckout()">
            Оформить заказ
        </button>


        <button onclick="closeCart()">
            Закрыть
        </button>

    </div>


    <!-- ========================= -->
    <!-- ОФОРМЛЕНИЕ ЗАКАЗА -->
    <!-- ========================= -->

    <div
        id="checkoutWindow"
        class="cart-window"
    >

        <h2>
            🛍️ Оформление заказа
        </h2>


        <input
            type="text"
            id="customerName"
            placeholder="Ваше имя"
        >


        <input
            type="text"
            id="customerPhone"
            placeholder="Номер телефона"
        >


        <button onclick="submitOrder()">
            Подтвердить заказ
        </button>


        <button onclick="closeCheckout()">
            Назад
        </button>

    </div>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="script.js"></script>


</body>

</html>
